name: CI

on:
  push:
    branches: [main, redesign/professional-portfolio]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check (strict)
        run: npm run check
      - name: Production build
        run: npm run build